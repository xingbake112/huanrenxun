  <style>
    :root {
      --bg: #070d0b;
      --white: #f3f8f1;
      --muted: #b9c5bb;
      --green: #a4ff22;
      --line: rgba(164,255,34,.18);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
      color: var(--white);
      background:
        radial-gradient(ellipse 65% 45% at 50% 62%, rgba(68,153,17,.15), transparent 74%),
        radial-gradient(ellipse 55% 50% at 85% 2%, rgba(85,165,24,.08), transparent 80%),
        var(--bg);
      overflow-x: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      z-index: -1;
      inset: 0;
      pointer-events: none;
      opacity: .3;
      background-image: radial-gradient(circle, rgba(142,231,72,.26) 1px, transparent 1px);
      background-size: 23px 23px;
      -webkit-mask-image: linear-gradient(to bottom,transparent 12%,black 100%);
      mask-image: linear-gradient(to bottom,transparent 12%,black 100%);
    }
    .shell {
      max-width: 1100px;
      min-height: 100svh;
      margin: 0 auto;
      padding: 22px 28px 24px;
      display: flex;
      flex-direction: column;
    }
    .topbar { display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:48px; }
    .mark { display:flex;align-items:center;gap:10px;letter-spacing:1.3px;font-weight:850;font-size:14px;white-space:nowrap; }
    .mark-icon {
      display:grid;place-items:center;width:35px;height:35px;
      border:1px solid #8be923;border-radius:9px;
      background:linear-gradient(145deg,#203c14,#0b130b);
      color:#b1ff39;font-weight:900;font-size:17px;
      box-shadow:inset 0 0 16px #96ff171c;
    }
    .chip {
      color:#a6b7a7;font-size:12px;padding:8px 12px;
      border:1px solid #476039;border-radius:999px;background:#17221899;
    }
    main { flex:1;display:flex;align-items:center;justify-content:center;padding:22px 0 14px; }
    .hero { width:100%;text-align:center;position:relative;isolation:isolate; }
    .portrait-wrap {
      height: min(37vw, 365px);min-height:245px;max-height:365px;
      position:relative;width:min(770px,100%);margin:0 auto -26px;
      overflow:hidden;
      border-radius:28px 28px 6px 6px;
      -webkit-mask-image:linear-gradient(to bottom,#000 0%,#000 53%,transparent 100%);
      mask-image:linear-gradient(to bottom,#000 0%,#000 53%,transparent 100%);
    }
    .portrait-wrap::after {content:"";position:absolute;inset:0;
      background:linear-gradient(0deg,#070d0b 0%,transparent 43%),linear-gradient(90deg,#070d0b44,transparent 25%,transparent 80%,#070d0b44);}
    .portrait {width:100%;height:100%;display:block;object-fit:cover;object-position:50% 38%;}
    .headline {position:relative;z-index:2;margin:0 0 9px;font-weight:900;letter-spacing:-1.5px;
      line-height:1.12;font-size:clamp(42px,6.5vw,80px);text-shadow:0 4px 30px #000b;}
    .headline span {color:var(--green);text-shadow:0 0 35px #8ce51d44;}
    .subline {display:flex;align-items:center;justify-content:center;gap:17px;margin:11px auto 0;}
    .subline .rule{width:78px;max-width:12%;height:2px;background:linear-gradient(90deg,transparent,#a4ff22);}
    .subline .rule.last{transform:rotate(180deg);}
    h2 {font-size:clamp(22px,3.5vw,33px);margin:0;font-weight:800;letter-spacing:1px;}
    .desc {margin:17px auto 26px;color:#d2dfd4;font-size:clamp(14px,1.8vw,18px);line-height:1.8;}
    .action-area {width:min(525px,100%);margin:0 auto;}
    .cta {
      appearance:none;-webkit-appearance:none;width:100%;min-height:78px;
      display:flex;align-items:center;justify-content:center;gap:19px;
      border:1px solid #e0ff8a;border-radius:22px;
      text-decoration:none;text-align:center;
      color:#0a1505;background:linear-gradient(180deg,#c1ff65 0%,#9df626 52%,#79d600 100%);
      box-shadow:0 4px 0 #4b9000,0 12px 40px rgba(142,245,34,.30),inset 0 2px 0 rgba(255,255,255,.4);
      font-size:clamp(21px,3vw,28px);font-weight:900;letter-spacing:2px;
      transition:transform .18s, box-shadow .18s,filter .18s;
      cursor:pointer;
    }
    .cta:hover {transform:translateY(-2px);filter:brightness(1.06);box-shadow:0 6px 0 #4b9000,0 15px 48px #90f52655;}
    .cta:active {transform:translateY(3px);box-shadow:0 1px 0 #4b9000,0 4px 20px #8feb2244;}
    .cta:focus-visible {outline:3px solid white;outline-offset:6px;}
    .cta svg {width:25px;height:25px;stroke-width:3.5;}
    .line-hint {margin:23px auto 0;display:flex;align-items:center;justify-content:center;gap:10px;color:#c6d2c7;font-size:14px;}
    .line-logo {width:30px;height:26px;background:#08c755;color:#fff;font-size:9px;font-family:Arial,sans-serif;font-weight:900;display:grid;place-items:center;border-radius:9px;position:relative;}
    .line-logo:after {content:"";position:absolute;bottom:-4px;left:7px;border-top:7px solid #08c755;border-right:7px solid transparent;}
    .error {min-height:22px;margin:12px 0 0;color:#ffd6a9;font-size:13px;text-align:center;}
    footer {display:flex;align-items:center;justify-content:center;gap:18px;color:#7d8e80;text-align:center;font-size:12px;line-height:1.7;padding:12px 0 0;}
    footer::before,footer::after {content:"";width:80px;max-width:12%;height:1px;background:linear-gradient(90deg,transparent,#4e634d);}
    footer::after {transform:rotate(180deg);}
    @media (max-width:640px) {
      .shell {padding:14px 17px 26px;}
      .topbar {min-height:38px;}
      .mark{font-size:12px;letter-spacing:.65px;}
      .mark-icon{width:30px;height:30px;font-size:14px;}
      .chip{padding:6px 8px;font-size:10px;}
      main{padding:12px 0 18px;align-items:flex-start;}
      .portrait-wrap{height:290px;min-height:0;margin:0 auto -38px;border-radius:15px 15px 0 0;}
      .portrait{object-position:50% 25%;}
      .headline {font-size:clamp(36px,10.3vw,58px);letter-spacing:-2.2px;margin:0 auto 15px;}
      .subline{gap:9px;}
      .subline .rule{width:27px;}
      h2{font-size:clamp(20px,6vw,26px);letter-spacing:0;}
      .desc {margin:15px auto 22px;font-size:14px;max-width:310px;}
      .cta {min-height:66px;border-radius:18px;font-size:23px;}
      .line-hint{margin-top:21px;gap:7px;font-size:12px;}
      footer {font-size:11px;gap:8px;}
    }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after{transition:none!important;scroll-behavior:auto!important;} }
